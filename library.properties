sentence=MLX90614 / GY-906 infrared non-contact thermometer: object and ambient temperature, emissivity, offset, checked data (PEC), clear messages. No dependencies.
paragraph=Reads the MLX90614 and GY-906 infrared thermometer over I2C with a one-line begin(): objectTemperature() for what the sensor looks at, ambientTemperature() for the surroundings, emissivity and offset settings, PEC checksum verification with a retry, and the data-sheet EEPROM write sequence. Explains wiring and range problems in Russian, Kazakh or English. Needs only the built-in Wire library. Works on Arduino AVR, ESP32, ESP8266. Examples included, made for classes and kits by Alash Electronics.
